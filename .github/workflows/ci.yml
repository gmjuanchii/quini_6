# [003] R-21, R-23: integración continua de QUINI_6.
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quini6
          POSTGRES_USER: quini6
          POSTGRES_PASSWORD: quini6-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quini6" --health-interval 5s --health-retries 10
    env:
      QUINI6_DEBUG: "1"
      QUINI6_DB_NAME: ${{ matrix.base == 'postgres' && 'quini6' || '' }}
      QUINI6_DB_USER: quini6
      QUINI6_DB_PASSWORD: quini6-ci
      QUINI6_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,prod]"
      - run: ruff check .
      - run: pytest
      - run: python manage.py exportar_contratos --verificar

  node:
    name: Node (tokens y estilos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:django
      - run: npm run test -w ui

  frontend:
    name: Next.js (Etapa 2)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # [003] R-17: los tipos de la API se regeneran desde contratos/openapi.json y deben estar
      # versionados.
      - run: npm run api:tipos -w frontend
      - run: git diff --exit-code frontend/src/api/esquema.d.ts
      - run: npm run lint -w frontend
      - run: npm run typecheck -w frontend
      - run: npm run test -w frontend
      - run: npm run build -w frontend
      - run: npm run storybook:build -w frontend

  e2e:
    name: Recorridos de punta a punta (Django)
    runs-on: ubuntu-latest
    needs: [python, node]
    env:
      QUINI6_DEBUG: "1"
      QUINI6_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: pip install -e ".[dev]"
      - run: npm ci
      - run: npm run build:django
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Playwright prepara la base E2E (preparar_e2e) y levanta Django en el puerto 8001.
      - run: npm run e2e
        env:
          E2E_PYTHON: python
