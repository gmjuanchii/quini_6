{% load ui %}<section class="my-4 rounded-card border border-border bg-surface p-4 shadow-1 sm:p-6" aria-labelledby="titulo-buscar">
  <h2 id="titulo-buscar">Buscar un sorteo</h2>
  <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2" style="align-items:flex-start">
    <form method="get" action="/resultados/buscar/" class="flex min-w-0 max-w-full flex-wrap items-end gap-3" role="search" aria-label="Buscar por número de sorteo" novalidate data-validar-formulario data-trabajando>
      <div class="campo">
        <label for="buscar-numero">Número de sorteo</label>
        <input type="text" id="buscar-numero" name="numero" inputmode="numeric" value="{{ numero|default:'' }}">
      </div>
      <button type="submit" class="{% clases 'boton' variante='secundario' %}" data-texto-trabajando="{% msg 'form.trabajando_consultar' %}">Buscar</button>
    </form>
    <form method="get" action="/resultados/buscar/" class="flex min-w-0 max-w-full flex-wrap items-end gap-3" role="search" aria-label="Buscar por fecha del sorteo" novalidate data-validar-formulario data-trabajando>
      {# [003] FR-010: el mismo campo de fecha que en el resto de la aplicación. #}
      {% campo_fecha nombre="fecha" id="buscar-fecha" etiqueta="Fecha del sorteo" valor=fecha error=error_fecha %}
      <button type="submit" class="{% clases 'boton' variante='secundario' %}" data-texto-trabajando="{% msg 'form.trabajando_consultar' %}">Buscar</button>
    </form>
  </div>
</section>
