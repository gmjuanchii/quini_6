# [003] R-20, R-21: entorno paritario de desarrollo.
# Django y Next.js corren en la máquina (recarga en caliente); aquí solo PostgreSQL 16 y el enrutador.
# Uso: docker compose up -d db   (y, desde la Etapa 2, docker compose up -d proxy)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${QUINI6_DB_NAME:-quini6}
      POSTGRES_USER: ${QUINI6_DB_USER:-quini6}
      POSTGRES_PASSWORD: ${QUINI6_DB_PASSWORD:?Falta QUINI6_DB_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - quini6-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QUINI6_DB_USER:-quini6} -d ${QUINI6_DB_NAME:-quini6}"]
      interval: 5s
      retries: 10

  proxy:
    image: caddy:2
    ports:
      - "8080:8080"
    environment:
      QUINI6_DJANGO_UPSTREAM: ${QUINI6_DJANGO_UPSTREAM:-host.docker.internal:8000}
      QUINI6_NEXT_UPSTREAM: ${QUINI6_NEXT_UPSTREAM:-host.docker.internal:3000}
      # [003] T153, T168: vacías = ninguna ruta (un patrón que no coincide con nada). En el entorno de
      # pruebas, QUINI6_RUTAS_NEXT lleva las rutas de la pantalla en prueba (quickstart § 2).
      QUINI6_RUTAS_NEXT: ${QUINI6_RUTAS_NEXT:-/_sin-rutas-next/}
      QUINI6_RUTAS_NEXT_SIN_RESPALDO: ${QUINI6_RUTAS_NEXT_SIN_RESPALDO:-/_sin-rutas-next/}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/no-disponible.html:/srv/no-disponible.html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  quini6-pg:
